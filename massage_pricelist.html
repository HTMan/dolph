<!DOCTYPE html>

	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<link rel="stylesheet" href="styles.css">
		<script>

			function show_image(image) {
				console.log("Ok");
				let field = document.getElementById("massage_pricelist_field");
				field.innerHTML = `<h2 class="info-title img_show-h2">${image.title}</h2><img class="img_show-image" src="${image.src}" alt="${image.title}">`;
			}
			
			let promise_json = fetch('json_data/massage_pricelist.json')
			.then(response => response.json())
			.catch(error => console.log(error));

			let promise_page_load = new Promise(resolve => {
				window.onload = resolve;
			});

			Promise.all([promise_json, promise_page_load]).then(([json_data]) => {

				let menu = document.getElementById("massage_pricelist_menu");
				menu.innerHTML = "";

				for (let i = 0; i < json_data.images.length; i++) {

					let title = json_data.images[i].title;
					let button = document.createElement("a");
					button.href = "javascript:void(0)";
					button.textContent = title;
					button.onclick = function() { show_image(json_data.images[i]); };
					menu.appendChild(button);
				}

				if (json_data.images.length > 0) {
					show_image(json_data.images[0]);
				}

			});

		</script>
		<title>Бассейн "Дельфин"</title>
	</head>
